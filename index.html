<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>My Book Notes</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f3ef;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 25px 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    color: #ccc;
}

main {
    max-width: 760px;
    margin: auto;
    padding: 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.07);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin: 13px 0 6px;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    background: #fafafa;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    background: #111;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button.secondary {
    background: #eee;
    color: #222;
}

button.delete {
    background: #d93636;
    margin-top: 10px;
}

.preview {
    width: 120px;
    height: 160px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 10px;
    display: none;
}

.book {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 15px;
    border-top: 1px solid #eee;
    padding: 16px 0;
}

.book img,
.no-cover {
    width: 100px;
    height: 140px;
    object-fit: cover;
    border-radius: 10px;
    background: #eee;
}

.no-cover {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
}

.book h3 {
    margin: 0 0 6px;
}

.meta {
    color: #777;
    font-size: 13px;
}

.note {
    margin-top: 9px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.empty {
    text-align: center;
    color: #888;
    padding: 25px;
}

@media (max-width: 600px) {
    .book {
        grid-template-columns: 80px 1fr;
    }

    .book img,
    .no-cover {
        width: 80px;
        height: 115px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 My Book Notes</h1>
    <p id="ownerText">by Your Name</p>
</header>

<main>

<!-- NAMA -->
<section class="card">
    <h2>👤 Nama Kamu</h2>

    <label>Nama</label>

    <input
        id="owner"
        type="text"
        placeholder="Contoh: Rizky"
        maxlength="30"
    >

    <p>
        <small>
            Nama ini akan muncul sebagai "My Book Notes by Nama".
        </small>
    </p>
</section>


<!-- TAMBAH BUKU -->
<section class="card">

    <h2>📖 Tambah Buku</h2>

    <label>Judul Buku</label>

    <input
        id="title"
        type="text"
        placeholder="Masukkan judul buku"
    >


    <label>Penulis</label>

    <input
        id="author"
        type="text"
        placeholder="Nama penulis"
    >


    <label>Status</label>

    <select id="status">

        <option>Sudah dibaca</option>

        <option>Sedang dibaca</option>

        <option>Ingin dibaca</option>

    </select>


    <label>Rating</label>

    <select id="rating">

        <option>⭐⭐⭐⭐⭐</option>

        <option>⭐⭐⭐⭐</option>

        <option>⭐⭐⭐</option>

        <option>⭐⭐</option>

        <option>⭐</option>

    </select>


    <label>Foto Sampul Buku</label>

    <input
        id="cover"
        type="file"
        accept="image/*"
    >

    <img
        id="preview"
        class="preview"
        alt="Preview"
    >


    <label>Catatan Buku</label>

    <textarea
        id="notes"
        placeholder="Tulis apa yang kamu pelajari dari buku ini..."
    ></textarea>

    <br><br>

    <button onclick="addBook()">
        + Simpan Buku
    </button>

</section>


<!-- KOLEKSI -->
<section class="card">

    <h2>📚 Koleksi Buku</h2>

    <input
        id="search"
        type="text"
        placeholder="🔎 Cari judul atau penulis..."
        oninput="renderBooks()"
    >

    <div id="books"></div>

</section>

</main>


<script>

let books =
    JSON.parse(
        localStorage.getItem("myBookNotesBooks") || "[]"
    );

let owner =
    localStorage.getItem("myBookNotesOwner") || "";

let selectedImage = "";


/* =========================
   NAMA PEMILIK
========================= */

const ownerInput =
    document.getElementById("owner");

const ownerText =
    document.getElementById("ownerText");

ownerInput.value = owner;

updateOwner();

ownerInput.addEventListener("input", function() {

    owner = ownerInput.value.trim();

    localStorage.setItem(
        "myBookNotesOwner",
        owner
    );

    updateOwner();

});


function updateOwner() {

    if (owner) {

        ownerText.textContent =
            "by " + owner;

    } else {

        ownerText.textContent =
            "by Your Name";

    }

}


/* =========================
   FOTO
========================= */

document
.getElementById("cover")
.addEventListener("change", function(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = function() {

        selectedImage =
            reader.result;

        const preview =
            document.getElementById("preview");

        preview.src =
            selectedImage;

        preview.style.display =
            "block";

    };

    reader.readAsDataURL(file);

});


/* =========================
   TAMBAH BUKU
========================= */

function addBook() {

    const title =
        document
        .getElementById("title")
        .value
        .trim();

    const author =
        document
        .getElementById("author")
        .value
        .trim();

    const status =
        document
        .getElementById("status")
        .value;

    const rating =
        document
        .getElementById("rating")
        .value;

    const notes =
        document
        .getElementById("notes")
        .value
        .trim();


    if (!title) {

        alert(
            "Masukkan judul buku terlebih dahulu."
        );

        return;

    }


    const book = {

        id: Date.now(),

        title: title,

        author: author,

        status: status,

        rating: rating,

        notes: notes,

        image: selectedImage

    };


    books.unshift(book);


    localStorage.setItem(
        "myBookNotesBooks",
        JSON.stringify(books)
    );


    document
    .getElementById("title")
    .value = "";

    document
    .getElementById("author")
    .value = "";

    document
    .getElementById("notes")
    .value = "";

    document
    .getElementById("cover")
    .value = "";


    selectedImage = "";


    document
    .getElementById("preview")
    .style.display = "none";


    renderBooks();

}


/* =========================
   HAPUS BUKU
========================= */

function deleteBook(id) {

    const yakin =
        confirm(
            "Yakin ingin menghapus buku ini?"
        );

    if (!yakin) return;


    books =
        books.filter(
            function(book) {

                return book.id !== id;

            }
        );


    localStorage.setItem(
        "myBookNotesBooks",
        JSON.stringify(books)
    );


    renderBooks();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    return String(text || "")
    .replace(
        /[&<>"']/g,
        function(character) {

            return {

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                '"': "&quot;",

                "'": "&#039;"

            }[character];

        }
    );

}


/* =========================
   TAMPILKAN BUKU
========================= */

function renderBooks() {

    const container =
        document.getElementById("books");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
        books.filter(
            function(book) {

                return (

                    book.title
                    .toLowerCase()
                    .includes(search)

                    ||

                    book.author
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    if (filtered.length === 0) {

        container.innerHTML =
            `
            <div class="empty">
                Belum ada buku 📚
            </div>
            `;

        return;

    }


    container.innerHTML =
        filtered
        .map(
            function(book) {

                const cover =
                    book.image

                    ?

                    `
                    <img
                        src="${book.image}"
                        alt="Sampul buku"
                    >
                    `

                    :

                    `
                    <div class="no-cover">
                        📕
                    </div>
                    `;


                return `

                <article class="book">

                    ${cover}

                    <div>

                        <h3>
                            ${escapeHTML(book.title)}
                        </h3>

                        <div class="meta">

                            ${escapeHTML(
                                book.author ||
                                "Penulis tidak diisi"
                            )}

                            ·

                            ${escapeHTML(book.status)}

                        </div>

                        <div>
                            ${book.rating}
                        </div>

                        <div class="note">

                            ${escapeHTML(
                                book.notes ||
                                "Tidak ada catatan."
                            )}

                        </div>

                        <button
                            class="delete"
                            onclick="deleteBook(${book.id})"
                        >
                            Hapus
                        </button>

                    </div>

                </article>

                `;

            }
        )
        .join("");

}


/* =========================
   JALANKAN
========================= */

renderBooks();

</script>

</body>
</html>
